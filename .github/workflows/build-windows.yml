name: Build Windows Installer

on:
  workflow_dispatch: {}        # 手动触发
  push:
    tags: ["v*"]               # 或推 v1.0.0 这类 tag 自动触发

jobs:
  build:
    runs-on: windows-latest
    env:
      # 把 Chromium 内核打进程序包，最终用户无需装任何东西
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "requests[socks]" playwright pyinstaller
          playwright install chromium

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --windowed --name VoiceRelay --collect-all playwright app.py

      - name: Prepare Inno Setup Chinese language file
        shell: cmd
        run: |
          curl -sSL -o "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl

      - name: Build installer (Inno Setup)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRelay-setup
          path: installer_output/VoiceRelay-setup.exe
